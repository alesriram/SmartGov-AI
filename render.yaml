services:
  # -------------------------------------------------------------
  # 1. FASTAPI BACKEND (Render Free Web Service)
  # -------------------------------------------------------------
  - type: web
    name: smartcity-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false

  # -------------------------------------------------------------
  # 2. REACT VITE FRONTEND (Render Free Static Site)
  # -------------------------------------------------------------
  - type: web
    name: smartcity-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: smartcity-backend
          property: host
